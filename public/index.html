<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAZI XMD</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#1a1a1a;border:1px solid #333;border-radius:22px;padding:26px;width:360px;text-align:center;box-shadow:0 0 20px #000}
.logo{width:75px;height:75px;background:linear-gradient(45deg,orange,#ffcc00);border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px}
h1{color:orange;margin:6px 0}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;box-sizing:border-box;margin:14px 0}
button{width:100%;padding:13px;border-radius:12px;border:none;background:orange;font-weight:bold;font-size:16px;cursor:pointer}
#codeBox{margin-top:16px;background:#000;padding:14px;border-radius:12px;font-size:24px;letter-spacing:4px;border:1px dashed orange}
</style>
</head><body>
<div class="card">
<div class="logo">⚡</div>
<h1>SHAZI XMD</h1>
<p>Owner: SHAZI - 03205610677</p>
<input id="num" placeholder="923205610677 likho">
<button onclick="getCode()">GET PAIR CODE</button>
<div id="codeBox">---- ----</div>
<p style="font-size:11px;color:#777;margin-top:14px">Powered by SHAZI XMD Bot</p>
</div>
<script>
async function getCode(){
let n=document.getElementById('num').value;
let b=document.getElementById('codeBox');
if(!n){b.innerText='Number likho';return}
b.innerText='Wait...';
let r=await fetch('/pair?number='+n);
let d=await r.json();
b.innerText=d.code||d.error;
}
</script>
</body></html>
